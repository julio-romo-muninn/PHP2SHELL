; Lab php.ini — PHP 8.4.4 + ASAN
; Attack surface: session.upload_progress (RFC1867 callback in ext/session)

expose_php = Off
; display_errors=Off: "Request Startup" warnings (rfc1867) would otherwise be
; written into the response body and break the header/cookie emission.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
log_errors = On
error_log = /dev/stderr

max_execution_time = 300
post_max_size = 1G
upload_max_filesize = 1G
max_file_uploads = 20

; --- Sessions ---------------------------------------------------------------
session.save_handler = files
session.save_path = /tmp/sessions
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 1
session.gc_probability = 0

; --- Upload progress (the vulnerable surface) --------------------------------
session.upload_progress.enabled = On
; cleanup=Off forces the MULTIPART_EVENT_END path with
; SEPARATE_ARRAY(&progress->data) plus the write via post_bytes_processed
; (ext/session/session.c, lines 3363-3367 in php-8.4.4).
session.upload_progress.cleanup = Off
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
; freq=1 (bytes): one progress update per FILE_DATA event received, i.e.
; php_session_initialize() -> php_session_track_init() on every chunk.
session.upload_progress.freq = 1
session.upload_progress.min_freq = 0
