; Lab settings for the cross-request test (stale global state).
; Low memory_limit so an OOM can be triggered while the request is being
; processed (the "application-independent trigger" described by advisory
; GHSA-6wmf-4rv5-p3rp for the session upload progress case).
memory_limit = 32M
; post_max_size above memory_limit: the OOM must happen while processing the
; input, not while rejecting it.
post_max_size = 256M
upload_max_filesize = 256M
